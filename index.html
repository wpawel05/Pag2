
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trasy - PAG</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-brand">Menu</span>
    </div>

    <nav class="sidebar-nav">
      <div class="sub-item">
        <div class="param-row">
          <label for="select-style">Podkład</label>
          <select id="select-style" class="search-select">
            <option value="osm">OpenStreetMap (wektor)</option>
            <option value="satelite">Zdjęcia lotnicze (ArcGIS)</option>
            <option value="ciemny">Ciemny (wektor)</option>
          </select>
        </div>
      </div>

            <div class="route-section">
        <div class="section-title">Algorytm</div>

        <div class="route-variants algorithm-buttons">
          <button id="algorithm-dijkstra" class="algorithm-button" type="button" aria-pressed="false">
            Dijkstra
          </button>

          <button id="algorithm-astar" class="algorithm-button active" type="button" aria-pressed="true">
            A*
          </button>
        </div>
      </div>
        <div class="section-title">Wariant trasy</div>

        <div class="route-variants">
          <button
            id="shortest-route"
            class="variant-button shortest-button active"
            type="button"
            aria-pressed="true"
            disabled
          >
            Najkrótsza
          </button>

          <button
            id="fastest-route"
            class="variant-button fastest-button"
            type="button"
            aria-pressed="false"
            disabled
          >
            Najszybsza
          </button>

          <button
            id="forest-route"
            class="variant-button forest-button"
            type="button"
            aria-pressed="false"
            disabled
          >
            Leśna
          </button>
        </div>
      </div>

      <p id="route-status">Kliknij mapę, aby wybrać start.</p>

      <div class="route-actions">
        <button id="clear-route" class="clear-button" type="button">
          Wyczyść trasę
        </button>
      </div>
    </nav>
  </aside>

  <div id="map"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
